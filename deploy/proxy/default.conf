# Shared proxy: routes https://<host>/ to multiple MCP servers.
# Certificates: one SAN/wildcard cert in ./certs covering all hostnames.
#
# Add one location block per MCP server. Service names are resolvable on the
# mcp-proxy network (compose sets them to <project>-<service>-1; the short
# name works when projects use explicit container_name or within the same
# project — otherwise use the fully qualified compose name).

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mcp.example.com;   # your hostname / wildcard

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # --- Wrike MCP (this project) -------------------------------------------
    # wrike-mcp container on the mcp-proxy network.
    location / {
        proxy_pass http://wrike-mcp:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Connection '';
        client_max_body_size 60m;
    }

    # --- Example: another MCP server ----------------------------------------
    # location /github/ {
    #     proxy_pass http://github-mcp:3000/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_buffering off;
    #     proxy_read_timeout 3600s;
    #     proxy_set_header Connection '';
    # }
    #
    # Alternatively route by subdomain instead of path:
    # server { server_name github.mcp.example.com; ... proxy_pass http://github-mcp:3000; }
}