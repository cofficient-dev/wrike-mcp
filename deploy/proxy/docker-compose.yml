# Shared reverse proxy for multiple MCP servers on one host.
#
# This compose project owns ports 80/443. Each MCP server (wrike-mcp, and any
# others) attaches to the `mcp-proxy` network and is routed here by path or
# subdomain. One cert (SAN or wildcard) covers all hostnames.
#
# Setup:
#   docker network create mcp-proxy
#   # put fullchain.pem / privkey.pem in deploy/proxy/certs/
#   docker compose -f deploy/proxy/docker-compose.yml up -d

services:
  proxy:
    image: nginx:1.27-bookworm
    container_name: mcp-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - mcp-proxy
    # TLS-friendly resilience for long-lived MCP streams.
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  mcp-proxy:
    external: true