# Wrike MCP server + nginx (TLS) reverse proxy.
#
# Usage:
#   1. Point a DNS A record at the droplet (e.g. wrike.example.com).
#   2. Obtain certs (see README "TLS certificates"): put fullchain.pem + privkey.pem
#      into ./certs/ (gitignored — never commit keys).
#   3. Put app credentials into .env (copy from .env.example).
#   4. docker compose up -d --build
#
# Users then connect at https://wrike.example.com/connect .

services:
  wrike-mcp:
    build: .
    container_name: wrike-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The app binds 0.0.0.0 *inside* the private compose network only;
      # nginx is the sole service with published ports.
      HOST: 0.0.0.0
      PORT: 3000
      TOKEN_STORE_PATH: /var/lib/wrike-mcp/tokens.json
    volumes:
      - wrike-tokens:/var/lib/wrike-mcp
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Secrets are injected via .env; nothing secret is baked into the image.
    # Resource caps keep a single misbehaving session from starving the droplet.
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-bookworm
    container_name: wrike-mcp-nginx
    restart: unless-stopped
    depends_on:
      wrike-mcp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal

networks:
  internal:
    # Private bridge network; only nginx publishes ports to the host.

volumes:
  wrike-tokens:
    # Holds only the AES-256-GCM encrypted token store (data/tokens.json
    # equivalent) — plaintext secrets are never written here.