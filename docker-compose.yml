# Wrike MCP server + Caddy (automatic TLS) reverse proxy.
#
# Usage:
#   1. Point a DNS A record at the host (e.g. wrike.example.com).
#   2. Put app credentials into .env (copy from .env.example).
#   3. Set the hostname and ACME email in Caddyfile.
#   4. docker compose up -d --build
#
# Caddy obtains and renews the certificate from Let's Encrypt itself — there
# is no certs/ folder, no certbot, and no renewal timer to run.
#
# Users then connect at https://wrike.example.com/connect .
#
# Running more than one MCP server on this host? Use the shared proxy in
# deploy/ instead (one host, one path per server) and attach this project to
# it with docker-compose.override.shared-proxy.yml.example.

services:
  wrike-mcp:
    build: .
    container_name: wrike-mcp
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # The app binds 0.0.0.0 *inside* the private compose network only;
      # Caddy is the sole service with published ports.
      HOST: 0.0.0.0
      PORT: 3000
      TOKEN_STORE_PATH: /var/lib/wrike-mcp/tokens.json
    volumes:
      - wrike-tokens:/var/lib/wrike-mcp
    expose:
      - "3000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Secrets are injected via .env; nothing secret is baked into the image.
    # Resource caps keep a single misbehaving session from starving the droplet.
    deploy:
      resources:
        limits:
          memory: 512M

  caddy:
    image: caddy:2.8-alpine
    container_name: wrike-mcp-caddy
    restart: unless-stopped
    depends_on:
      wrike-mcp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # TLS certs + ACME account keys — keep across rebuilds
      - caddy-config:/config
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  internal:
    # Private bridge network; only Caddy publishes ports to the host.

volumes:
  wrike-tokens:
    # Holds only the AES-256-GCM encrypted token store (data/tokens.json
    # equivalent) — plaintext secrets are never written here.
  caddy-data:
    # Certificates and ACME account keys; losing it means re-issuing certs.
  caddy-config:
