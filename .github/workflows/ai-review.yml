name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Least privilege: the reusable workflow only needs to read the diff and
# write review comments. Declared here because the caller's grant is the
# ceiling for everything the called workflow can do.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Tracks @master on purpose: improvements to the central workflow (model,
    # prompt, fixes) apply to every repo that calls it.
    uses: cofficient-dev/central-workflows/.github/workflows/ai-review.yml@master
    secrets:
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
